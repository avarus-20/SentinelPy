# Example: authorized SentinelPy header scan in GitHub Actions.
# Copy to .github/workflows/ and set TARGET_URL (repository variable or secret).
name: SentinelPy header scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: HTTPS URL you are authorized to scan
        required: true
        default: https://example.com

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      TARGET_URL: ${{ inputs.target_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SentinelPy (pin tag or SHA in production)
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/avarus-20/SentinelPy@v1.2.1"

      - name: Scan — JSON report
        id: json_scan
        run: |
          set +e
          sentinelpy scan "$TARGET_URL" --format json --output sentinelpy-report.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "SentinelPy exit code: $code (0=ok/warning, 1=failed findings, 2=usage, 3=scan error)"
          set -e
          test -f sentinelpy-report.json

      - name: Scan — Markdown report
        run: |
          sentinelpy scan "$TARGET_URL" --format markdown --output sentinelpy-report.md

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: sentinelpy-reports
          path: |
            sentinelpy-report.json
            sentinelpy-report.md

      - name: Fail job on failed findings (optional policy)
        if: steps.json_scan.outputs.exit_code == '1'
        run: |
          python - <<'PY'
          import json
          import sys

          data = json.load(open("sentinelpy-report.json", encoding="utf-8"))
          status = data.get("summary", {}).get("status")
          if status == "failed":
              sys.exit(1)
          PY

      - name: Fail job on scan errors
        if: |
          steps.json_scan.outputs.exit_code == '2' ||
          steps.json_scan.outputs.exit_code == '3'
        run: exit 1
