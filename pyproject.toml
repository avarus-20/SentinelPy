[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelpy"
version = "0.4.0"
description = "A Python tool for checking common website security configurations."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
sentinelpy = "sentinelpy.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
